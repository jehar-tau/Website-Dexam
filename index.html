<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f3" />
    <script>
      // Apply the preference before the first paint, including pre-rendered pages.
      (function () {
        var theme;
        try { theme = localStorage.getItem('dexam-theme'); } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#12251f' : '#faf9f3';
      }());
    </script>
    <title>DEXAM — Design Exam Academy | NID, UCEED, NIFT, NATA & CEED Coaching in Pune</title>
    <meta name="description" content="DEXAM prepares students in Pune for India's top design and architecture entrance exams — NID DAT, UCEED, NIFT, NATA and CEED. Free previous year papers, counselling and expert mentorship." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Decodes the redirect from public/404.html back into a real path
      // before React Router reads the URL. See public/404.html for context.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
